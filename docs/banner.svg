<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0610"/>
      <stop offset="0.55" stop-color="#0b070d"/>
      <stop offset="1" stop-color="#120414"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2d55" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff2d55" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c026d3" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c026d3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drop" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ff8197"/>
      <stop offset="0.45" stop-color="#ff2d55"/>
      <stop offset="1" stop-color="#8e0a30"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#ffc6d0"/>
      <stop offset="1" stop-color="#ff2d55"/>
    </linearGradient>
    <linearGradient id="ecgfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d55" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#ff2d55"/>
      <stop offset="0.85" stop-color="#ff5f7c"/>
      <stop offset="1" stop-color="#ff5f7c" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="frame"><rect width="1200" height="380" rx="24"/></clipPath>
  </defs>

  <style>
    .blob1 { animation: drift1 12s ease-in-out infinite alternate; transform-origin: center; }
    .blob2 { animation: drift2 15s ease-in-out infinite alternate; transform-origin: center; }
    @keyframes drift1 { from { transform: translate(0,0) scale(1); } to { transform: translate(60px,30px) scale(1.15); } }
    @keyframes drift2 { from { transform: translate(0,0) scale(1.1); } to { transform: translate(-70px,-20px) scale(0.95); } }

    .drop { transform-origin: 960px 200px; animation: beat 1.4s ease-in-out infinite; }
    @keyframes beat { 0%,100% { transform: scale(1); } 14% { transform: scale(1.12); } 28% { transform: scale(0.97); } 42% { transform: scale(1.06); } }
    .ring { transform-origin: 960px 205px; animation: ring 2.8s ease-out infinite; }
    .ring.r2 { animation-delay: 1.4s; }
    @keyframes ring { from { transform: scale(0.6); opacity: 0.8; } to { transform: scale(2.2); opacity: 0; } }

    .ecg { stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: ecg 3s linear infinite; }
    @keyframes ecg { 0% { stroke-dashoffset: 1400; } 70% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }

    .tag { opacity: 0; animation: tag 9s infinite; }
    .t2 { animation-delay: 3s; } .t3 { animation-delay: 6s; }
    @keyframes tag { 0% { opacity: 0; transform: translateY(8px); } 5%,30% { opacity: 1; transform: translateY(0); } 36%,100% { opacity: 0; transform: translateY(-8px); } }

    .p { animation: rise linear infinite; opacity: 0; }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 0.9; } 100% { transform: translateY(-220px); opacity: 0; } }

    .live { animation: blink 1.2s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: 0.25; } }

    text { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <ellipse class="blob1" cx="900" cy="180" rx="320" ry="220" fill="url(#glow1)"/>
    <ellipse class="blob2" cx="250" cy="330" rx="300" ry="200" fill="url(#glow2)"/>

    <!-- rising particles -->
    <g fill="#ff5f7c">
      <circle class="p" cx="720" cy="380" r="3" style="animation-duration:6s;animation-delay:0s"/>
      <circle class="p" cx="800" cy="390" r="2" style="animation-duration:7s;animation-delay:1.2s"/>
      <circle class="p" cx="1080" cy="385" r="3.5" style="animation-duration:8s;animation-delay:0.6s"/>
      <circle class="p" cx="1130" cy="395" r="2" style="animation-duration:6.5s;animation-delay:2.4s"/>
      <circle class="p" cx="860" cy="390" r="2.5" style="animation-duration:9s;animation-delay:3s"/>
      <circle class="p" cx="1010" cy="395" r="2" style="animation-duration:7.5s;animation-delay:4s"/>
      <circle class="p" cx="640" cy="395" r="2" style="animation-duration:8.5s;animation-delay:2s"/>
    </g>

    <!-- ECG line -->
    <path d="M0 300 H380 l18 0 l12 -26 l14 52 l16 -96 l16 118 l12 -48 l10 0 H700 l14 0 l10 -18 l12 36 l14 -70 l14 84 l10 -32 H1200"
          stroke="#ff2d55" stroke-opacity="0.12" stroke-width="2"/>
    <path class="ecg" d="M0 300 H380 l18 0 l12 -26 l14 52 l16 -96 l16 118 l12 -48 l10 0 H700 l14 0 l10 -18 l12 36 l14 -70 l14 84 l10 -32 H1200"
          stroke="url(#ecgfade)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- pulsing drop -->
    <circle class="ring" cx="960" cy="205" r="70" stroke="#ff2d55" stroke-width="2"/>
    <circle class="ring r2" cx="960" cy="205" r="70" stroke="#ff2d55" stroke-width="2"/>
    <g class="drop">
      <path d="M960 95 C960 95 895 175 895 220 C895 257 924 287 960 287 C996 287 1025 257 1025 220 C1025 175 960 95 960 95Z" fill="#ff2d55" filter="url(#blur)" opacity="0.6"/>
      <path d="M960 95 C960 95 895 175 895 220 C895 257 924 287 960 287 C996 287 1025 257 1025 220 C1025 175 960 95 960 95Z" fill="url(#drop)"/>
      <path d="M928 228 C928 208 937 192 947 180" stroke="#fff" stroke-opacity="0.6" stroke-width="7" stroke-linecap="round"/>
    </g>

    <!-- title -->
    <g transform="translate(70 0)">
      <rect x="0" y="62" width="214" height="30" rx="15" fill="#ff2d55" fill-opacity="0.12" stroke="#ff2d55" stroke-opacity="0.4"/>
      <circle class="live" cx="20" cy="77" r="5" fill="#ff2d55"/>
      <text x="34" y="82" fill="#ffc6d0" font-size="14" font-weight="600" letter-spacing="0.5">LIVE DONOR NETWORK</text>

      <text x="0" y="168" fill="url(#title)" font-size="84" font-weight="800" letter-spacing="-3">bloodline</text>

      <text class="tag t1" x="2" y="214" fill="#c9c3d3" font-size="24">Every drop finds its way. 🩸</text>
      <text class="tag t2" x="2" y="214" fill="#c9c3d3" font-size="24">Find compatible donors near you — in seconds.</text>
      <text class="tag t3" x="2" y="214" fill="#c9c3d3" font-size="24">Post an emergency. Nearby donors get alerted.</text>

      <text x="2" y="252" fill="#8d869a" font-size="15" letter-spacing="1.5">NEXT.JS · MONGODB · NODE · REACT THREE FIBER · LEAFLET</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="24" stroke="#ff2d55" stroke-opacity="0.25"/>
</svg>
